<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The voltage of a chemical cell</title>
</head>
<body>
<script src="/vendor/kit/0.1.0/core.js"></script>
<script>
  var env = Synapse.environment({ title: "The voltage of a chemical cell", note: "A voltaic cell joins two half-cells. The half-cell with the more positive electrode potential is the positive terminal, and the cell voltage is its potential minus the potential of the negative terminal.", kicker: "Interactive chemistry lab", tryThis: "See how the voltage of a voltaic cell depends on the standard electrode potentials of its two half-cells." });
  Synapse.predictCard(env, {"prompt": "A zinc half-cell is joined to a half-cell with a more positive electrode potential. What happens to the cell voltage as the difference between the two potentials grows?", "choices": ["It rises", "It stays the same", "It falls"], "reveal": "Raise the electrode potential of the positive half-cell and watch the cell voltage."});
  var c_positive = Synapse.slider(env, {"id": "positive", "label": "Electrode potential of the positive half-cell", "unit": "V", "min": -0.26, "max": 0.84, "value": 0.34, "grid": 11});
  
  var m_cell = Synapse.cellVoltage({ anode_potential: -0.76, cathode_potential: c_positive });
  Synapse.readout(env, { label: "Cell voltage", unit: "V", value: m_cell, digits: 2 });
  
  Synapse.graph(env, { title: "The cell voltage rises in a straight line as the positive half-cell's potential rises.", x: c_positive, y: m_cell, yLabel: "Cell voltage", yUnit: "V", digits: 2 });
  
  Synapse.text(env, "The negative half-cell is a zinc electrode, the metal with the more negative electrode potential.");
  Synapse.text(env, "The cell voltage is the electrode potential of the positive terminal minus that of the negative terminal.");
  Synapse.hintLadder(env, { hints: ["Each half-cell has its own standard electrode potential.", "Which half-cell has the more positive potential? That is the positive terminal.", "Subtract the potential of the negative terminal from the potential of the positive terminal."] });
  Synapse.conceptCheck(env, {"question": "How is the standard cell voltage of a voltaic cell found?", "options": ["Add the two standard electrode potentials", "Subtract the potential of the anode from the potential of the cathode", "Subtract the potential of the cathode from the potential of the anode"], "correct": 1, "explanation": "The cell voltage is the electrode potential of the cathode, the positive terminal, minus the electrode potential of the anode, the negative terminal."});
  
  Synapse.reset(env);
  Synapse.bridge.ready();
</script>
</body>
</html>
