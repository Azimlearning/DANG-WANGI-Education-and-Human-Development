<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pressure and depth</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 16px; margin: 0; padding: 12px; max-width: 360px; box-sizing: border-box; color: #1a1a1a; background: #ffffff; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .row { min-height: 48px; display: flex; flex-direction: column; justify-content: center; margin: 8px 0; }
  input[type=range] { width: 100%; min-height: 44px; }
  output { display: block; font-size: 20px; font-weight: 600; padding: 8px 0; }
  p { margin: 8px 0; line-height: 1.4; }
</style>
</head>
<body>
<h1>Pressure and depth</h1>
<p>Explore how the pressure in water changes as you go deeper.</p>
<div class="row">
  <label for="depth">Depth h in metres</label>
  <input type="range" id="depth" data-synapse-control="depth" min="0" max="10" step="0.5" value="2" aria-label="Depth in metres" aria-valuetext="2 metres">
</div>
<output data-synapse-readout="pressure" aria-label="Pressure from the water in kilopascals">0</output>
<p>The pressure from a liquid is p = h x rho x g. Here rho is 1000 kg/m3 for water and g is 9.81 m/s2.</p>
<p>Double the depth and the pressure from the water doubles too.</p>
<script>
(function () {
  var RHO_KG_PER_M3 = 1000;
  var G_M_PER_S2 = 9.81;
  var depth = document.getElementById("depth");
  var out = document.querySelector("[data-synapse-readout=pressure]");
  function pressureKpa(hMetres) { return hMetres * RHO_KG_PER_M3 * G_M_PER_S2 / 1000; }
  function show() {
    var h = Number(depth.value);
    depth.setAttribute("aria-valuetext", h + " metres");
    out.textContent = pressureKpa(h).toFixed(1) + " kPa";
  }
  depth.addEventListener("input", show);
  show();
})();
</script>
</body>
</html>
