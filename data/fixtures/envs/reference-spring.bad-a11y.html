<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unnamed controls</title>
</head>
<body>
<script src="/vendor/kit/0.0.1/core.js"></script>
<script>
  var env = Synapse.environment({ title: "Why does a spring stretch?", note: "A spring with unnamed controls." });
  var inp = document.createElement("input");
  inp.type = "range"; inp.min = "0"; inp.max = "10"; inp.value = "2";
  inp.style.minHeight = "44px";
  inp.setAttribute("data-synapse-control", "load");
  env.controls.appendChild(inp);
  var out = document.createElement("output");
  out.setAttribute("data-synapse-readout", "Extension");
  out.textContent = "0.040";
  env.readouts.appendChild(out);
  inp.addEventListener("input", function () { out.textContent = (Number(inp.value) / 50).toFixed(3); });
  Synapse.bridge.ready();
</script>
</body>
</html>
