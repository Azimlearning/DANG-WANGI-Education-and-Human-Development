<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hooke&#x27;s law: how does a spring stretch?</title>
</head>
<body>
<script src="/vendor/kit/0.1.0/core.js"></script>
<script>
  var env = Synapse.environment({ title: "Hooke's law: how does a spring stretch?", note: "Hang a load on a spring and it stretches. Within the elastic limit the extension is proportional to the load: extension = load / k." });
  Synapse.predictCard(env, {"prompt": "What will happen to the extension if you double the load?", "choices": ["It will be less", "It will double", "It will stay the same"], "reveal": "Set the load to 2 N, then to 4 N, and compare the two extensions."});
  Synapse.experiment(env, {"aim": "To find how the extension of a spring depends on the load", "hypothesis": "The extension is directly proportional to the load", "independent": "Load (N)", "dependent": "Extension (m)", "controlled": ["The same spring"], "apparatus": ["Spring", "Slotted weights", "Metre rule"]});
  Synapse.stepper(env, { steps: ["Hang masses until the load is 2 N, then press Record.", "Hang more masses until the load is 4 N, then press Record.", "Hang all the masses so the load is 10 N, then press Record.", "Compare the extension each time the load doubles."] });
  var c_load = Synapse.massHanger(env, {"id": "load", "label": "Load", "unit": "N", "min": 0.0, "max": 10.0, "value": 2.0, "grid": 5});
  
  var m_spring = Synapse.hookes({ k: 50.0, load: c_load });
  Synapse.readout(env, { label: "Extension", unit: "m", value: m_spring, digits: 3 });
  Synapse.graph(env, { title: "The extension rises in a straight line with the load.", x: c_load, y: m_spring, yLabel: "Extension", yUnit: "m", digits: 3 });
  Synapse.springScene(env, { extension: m_spring, full: 0.25 });
  Synapse.table(env, { caption: "Results", columns: [
    { label: "Load", unit: "N", value: c_load, digits: 1 },
    { label: "Extension", unit: "m", value: m_spring, digits: 3 }
  ] });
  Synapse.text(env, "The spring constant is 50 N/m.");
  
  Synapse.conceptCheck(env, {"question": "Within the elastic limit, what happens to the extension of the spring when the load is doubled?", "options": ["It halves", "It doubles", "It stays the same"], "correct": 1, "explanation": "Within the elastic limit the extension is proportional to the load, so doubling the load doubles the extension."});
  
  Synapse.reset(env);
  Synapse.bridge.ready();
</script>
</body>
</html>
