# Continuous integration: the same commands CLAUDE.md lists, on every push to main and every pull request.
# No secrets are used. Fakes are the default (SYNAPSE_LLM_MODE=fake), and the test suite refuses any non-loopback connection,
# so a run can never make a paid call. Kit builds are deterministic: the build step fails if the Kit differs from kit-lock.json.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SYNAPSE_LLM_MODE: fake

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @synapse/kit build
      - run: pnpm codegen:check
      - run: pnpm -r typecheck
      - run: pnpm -r test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @synapse/kit build
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check api eval
      - run: uv run pyright api eval
      - run: uv run pytest -q
      - run: uv run python eval/hostile/run.py
      - run: uv run python eval/l6/run.py

  smoke:
    # The real-browser path on Linux: the API on fakes, the built web app, headless Chromium (eval/smoke/web_smoke.py).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @synapse/kit build
      - run: uv run playwright install --with-deps chromium
      - run: uv run python eval/smoke/web_smoke.py
